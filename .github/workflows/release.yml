name: Release

# Pushing a tag vX.Y.Z builds RCodeBar.app with install.sh, signs it with the Developer ID held in
# the repository secrets, notarizes it and attaches RCodeBar.zip and its checksum to that tag's
# release, creating the release if none exists yet. workflow_dispatch does the same without a
# release, so the signing path can be checked first.
#
# Secrets: DEVELOPER_ID_P12_BASE64 (the "Developer ID Application" identity exported as .p12,
# base64), DEVELOPER_ID_P12_PASSWORD, APPLE_ID, APP_SPECIFIC_PASSWORD (an app password of that
# Apple ID, for notarytool). The team id comes from the identity name.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: sign, notarize, release (macOS)
    runs-on: macos-15
    # A notary service stall would otherwise bill the 6 hour default at the macOS rate.
    timeout-minutes: 60
    steps:
      # Before anything is built: a missing secret must not ship a half-signed or unnotarized app.
      - name: Require the signing secrets
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          missing=0
          for s in DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD APPLE_ID APP_SPECIFIC_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::repository secret $s is not set"; missing=1; }
          done
          exit "$missing"

      - uses: actions/checkout@v5

      # ci.yml does not run on tags; this is the release's only test gate.
      - run: swift test

      - name: Import the Developer ID into a throwaway keychain
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/release.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 1800 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$P12_BASE64" | base64 --decode >"$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/id.p12"
          # Lets codesign use the key without a UI prompt; the runner has no one to click Allow.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$kc" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)
          [ -n "$identity" ] || { echo "no Developer ID Application identity in the p12" >&2; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"

      # install.sh signs with CODESIGN_IDENTITY and the hardened runtime notarization requires.
      - run: ./install.sh

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          app="$HOME/Applications/RCodeBar.app"
          codesign -d -r- "$app" 2>&1 | grep designated
          team=${CODESIGN_IDENTITY##*\(}
          notary=(--apple-id "$APPLE_ID" --team-id "${team%)}" --password "$APP_SPECIFIC_PASSWORD")
          # notarytool takes a zip, not an .app; the ticket is stapled to the .app, and the
          # release zip is rebuilt from it afterwards so it carries the ticket offline.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          id=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${notary[@]}" --output-format json \
            | sed -n 's/.*"id" *: *"\([^"]*\)".*/\1/p')
          echo "notarization submission $id"
          # The wait is a long poll; a dropped connection fails it without failing the submission.
          status=""
          for _ in 1 2 3; do
            status=$(xcrun notarytool wait "$id" "${notary[@]}" --output-format json \
              | sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p') && [ -n "$status" ] && break
            sleep 30
          done
          echo "notarization $status"
          [ "$status" = Accepted ] || { xcrun notarytool log "$id" "${notary[@]}"; exit 1; }
          xcrun stapler staple "$app"

      - name: Zip and verify the stapled app
        run: |
          set -euo pipefail
          app="$HOME/Applications/RCodeBar.app"
          spctl -a -vv -t exec "$app"
          xcrun stapler validate "$app"
          ditto -c -k --keepParent "$app" RCodeBar.zip
          shasum -a 256 RCodeBar.zip | tee RCodeBar.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: RCodeBar
          overwrite: true # a re-run would otherwise collide with the first attempt's artifact
          path: |
            RCodeBar.zip
            RCodeBar.zip.sha256

      - name: Attach to the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # create with assets drafts, uploads, then publishes, so a new release is never public empty.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" RCodeBar.zip RCodeBar.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" RCodeBar.zip RCodeBar.zip.sha256 --generate-notes
          fi
