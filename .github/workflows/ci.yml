name: CI

on:
  push:
    branches: [main]
  pull_request:

# macOS runners bill at 10x, so don't leave superseded runs going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test

  format:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # swift-format ships with the toolchain; nothing to install.
      - run: swift format lint --recursive --strict Sources Tests

  shell:
    # The scripts are half the install story and nothing else checks them.
    # Ubuntu, not macOS: shellcheck is preinstalled here and bills at 1x.
    # -S warning drops style notes on the deliberate `ls -t`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck -S warning install.sh scripts/e2e_test.sh shell/code
