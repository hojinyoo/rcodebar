name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# macOS runners bill at 10x, so don't leave superseded runs going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      # The scripts are half the install story and nothing else compiles them.
      - run: bash -n install.sh scripts/e2e_test.sh shell/code

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # install.sh already builds, packages and signs; don't restate the bundle here.
      - run: ./install.sh
      - run: ditto -c -k --keepParent "$HOME/Applications/RCodeBar.app" RCodeBar.zip
      # Ad-hoc signed, so no notarization: downloaders must clear quarantine
      # themselves (xattr -dr com.apple.quarantine RCodeBar.app).
      - run: gh release create "$GITHUB_REF_NAME" RCodeBar.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
